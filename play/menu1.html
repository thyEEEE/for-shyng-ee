<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="play.css"/>
    <title>for shyngee</title>
</head>
<body>
    <div class="new">
        <h1>第二关</h1>
        <h2>看看你了不了解我</h2>
        <div id="game">
            <form onsubmit="check(); return false;">
                <h3>我最喜欢的游戏</h3>
                <select id="favGame">
                    <option>PUBG</option>
                    <option>Minecraft</option>
                    <option>Apex</option>
                    <option>Valorant</option>
                </select><input type="submit" value="确认">
                
                
                
            </form>
        </div>
    </div>
    <script>
        function check(){
            let e = document.getElementById("favGame");
            let input = e.options[e.selectedIndex].text;
            if(input == "Apex"){

                alert("答对了！前往下一关");
                document.location.replace("menu2.html")
            }else{
                alert("答错了！再来")
            }
        }
    </script>
</body>
</html>
